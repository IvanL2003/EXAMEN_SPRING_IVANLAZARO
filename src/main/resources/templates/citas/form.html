<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::content}, ~{::title}, ~{::scripts})}">
<head>
    <title>Nueva Cita</title>
</head>
<body>
<div th:fragment="content">
    <h2 class="mb-4">Nueva Cita</h2>

    <form th:action="@{/citas}" th:object="${cita}" method="post" class="card p-4 shadow-sm">
        <div class="mb-3">
            <label for="paciente" class="form-label">Paciente</label>
            <input type="text" class="form-control" id="paciente" th:field="*{paciente}" required>
        </div>
        <div class="mb-3">
            <label for="doctorId" class="form-label">Doctor</label>
            <select class="form-select" id="doctorId" name="doctorId">
                <option value="">Seleccionar doctor...</option>
                <option th:each="doctor : ${doctores}"
                        th:value="${doctor.id}"
                        th:text="${doctor.nombre + ' - ' + doctor.especialidad}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label for="fecha" class="form-label">Fecha</label>
            <input type="date" class="form-control" id="fecha" th:field="*{fecha}" required>
        </div>
        <div class="mb-3">
            <label for="hora" class="form-label">Hora</label>
            <input type="text" class="form-control" id="hora" th:field="*{hora}" required placeholder="Ej: 10:00">
        </div>
        <div class="mb-3">
            <label for="motivo" class="form-label">Motivo</label>
            <textarea class="form-control" id="motivo" th:field="*{motivo}" rows="3"></textarea>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a th:href="@{/citas}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
<th:block th:fragment="scripts"></th:block>
</body>
</html>
