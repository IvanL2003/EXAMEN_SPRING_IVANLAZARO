<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::content}, ~{::title}, ~{::scripts})}">
<head>
    <title>Citas</title>
</head>
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Listado de Citas</h2>
        <a th:href="@{/citas/new}" class="btn btn-success">
            <i class="bi bi-plus-circle"></i> Nueva Cita
        </a>
    </div>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <table class="table table-striped table-hover">
        <thead class="table-primary">
            <tr>
                <th>ID</th>
                <th>Paciente</th>
                <th>Doctor</th>
                <th>Fecha</th>
                <th>Hora</th>
                <th>Motivo</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="cita : ${citas}">
                <td th:text="${cita.id}"></td>
                <td th:text="${cita.paciente}"></td>
                <td th:text="${cita.doctor != null ? cita.doctor.nombre : 'Sin asignar'}"></td>
                <td th:text="${cita.fecha}"></td>
                <td th:text="${cita.hora}"></td>
                <td th:text="${cita.motivo}"></td>
                <td>
                    <a th:href="@{/citas/delete/{id}(id=${cita.id})}" class="btn btn-danger btn-sm"
                       onclick="return confirm('Seguro que deseas eliminar esta cita?')">
                        <i class="bi bi-trash"></i> Eliminar
                    </a>
                </td>
            </tr>
        </tbody>
    </table>
</div>
<th:block th:fragment="scripts"></th:block>
</body>
</html>
