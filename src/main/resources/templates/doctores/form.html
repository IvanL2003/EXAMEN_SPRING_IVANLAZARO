<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::content}, ~{::title}, ~{::scripts})}">
<head>
    <title>Nuevo Doctor</title>
</head>
<body>
<div th:fragment="content">
    <h2 class="mb-4">Nuevo Doctor</h2>

    <form th:action="@{/doctores}" th:object="${doctor}" method="post" class="card p-4 shadow-sm">
        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="nombre" th:field="*{nombre}" required>
        </div>
        <div class="mb-3">
            <label for="especialidad" class="form-label">Especialidad</label>
            <select class="form-select" id="especialidad" th:field="*{especialidad}">
                <option value="">Seleccionar...</option>
                <option value="general">General</option>
                <option value="cirugia">Cirugia</option>
                <option value="otro">Otro</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="telefono" class="form-label">Telefono</label>
            <input type="text" class="form-control" id="telefono" th:field="*{telefono}">
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" th:field="*{email}">
        </div>
        <div class="mb-3">
            <label for="consultorio" class="form-label">Consultorio</label>
            <select class="form-select" id="consultorio" th:field="*{consultorio}">
                <option value="">Seleccionar...</option>
                <option value="Delicias">Delicias</option>
                <option value="Sagasta">Sagasta</option>
                <option value="Clinico">Clinico</option>
            </select>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a th:href="@{/doctores}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
<th:block th:fragment="scripts"></th:block>
</body>
</html>
