<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::content}, ~{::title}, ~{::scripts})}">
<head>
    <title>Doctores</title>
</head>
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Listado de Doctores</h2>
        <a th:href="@{/doctores/new}" class="btn btn-success">
            <i class="bi bi-plus-circle"></i> Nuevo Doctor
        </a>
    </div>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <table class="table table-striped table-hover">
        <thead class="table-primary">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Especialidad</th>
                <th>Telefono</th>
                <th>Email</th>
                <th>Consultorio</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="doctor : ${doctores}">
                <td th:text="${doctor.id}"></td>
                <td th:text="${doctor.nombre}"></td>
                <td th:text="${doctor.especialidad}"></td>
                <td th:text="${doctor.telefono}"></td>
                <td th:text="${doctor.email}"></td>
                <td th:text="${doctor.consultorio}"></td>
            </tr>
        </tbody>
    </table>
</div>
<th:block th:fragment="scripts"></th:block>
</body>
</html>
