<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::content}, ~{::title}, ~{::scripts})}">
<head>
    <title>Graficos</title>
</head>
<body>
<div th:fragment="content">
    <h2 class="mb-4">Dashboard de Consultame</h2>

    <div class="row">
        <!-- Polar Area Chart: Doctores por Consultorio -->
        <div class="col-md-6 mb-4">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">Doctores por Consultorio (Polar Area)</h5>
                </div>
                <div class="card-body">
                    <canvas id="chartConsultorio"></canvas>
                </div>
            </div>
        </div>

        <!-- Pie Chart: Doctores por Especialidad -->
        <div class="col-md-6 mb-4">
            <div class="card">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0">Doctores por Especialidad (Tarta)</h5>
                </div>
                <div class="card-body">
                    <canvas id="chartEspecialidad"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block th:fragment="scripts">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
    const COLORES = ['#FF6384','#36A2EB','#FFCE56','#4BC0C0','#9966FF','#FF9F40'];

    // Polar Area Chart - Doctores por Consultorio (Delicias, Sagasta, Clinico)
    fetch('/api/graficos/doctores-por-consultorio')
        .then(r => r.json())
        .then(data => {
            new Chart(document.getElementById('chartConsultorio'), {
                type: 'polarArea',
                data: {
                    labels: data.map(d => d.consultorio || 'Sin especificar'),
                    datasets: [{
                        data: data.map(d => d.total),
                        backgroundColor: COLORES.slice(0, data.length)
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { position: 'bottom' } }
                }
            });
        });

    // Pie Chart - Doctores por Especialidad (general, cirugia, otro)
    fetch('/api/graficos/doctores-por-especialidad')
        .then(r => r.json())
        .then(data => {
            new Chart(document.getElementById('chartEspecialidad'), {
                type: 'pie',
                data: {
                    labels: data.map(d => d.especialidad || 'Sin especificar'),
                    datasets: [{
                        data: data.map(d => d.total),
                        backgroundColor: COLORES.slice(0, data.length)
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { position: 'bottom' } }
                }
            });
        });
</script>
</th:block>
</body>
</html>
