# CI - Integracion Continua
# Este workflow se activa cuando un desarrollador sube codigo a la rama dev.
# Su funcion es validar que el proyecto compila correctamente y que los tests pasan.

name: CI - Tests

# Se activa con cada push a la rama dev
on:
  push:
    branches:
      - dev

jobs:
  test:
    # Se ejecuta en Windows y macOS para comprobar compatibilidad multiplataforma
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    # Define el sistema operativo del runner segun la matriz
    runs-on: ${{ matrix.os }}

    steps:
      # Paso 1: Descarga el codigo fuente del repositorio
      - name: Checkout del codigo
        uses: actions/checkout@v4

      # Paso 2: Configura Java 21 con la distribucion Temurin
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Paso 3: Limpieza total de la carpeta target para asegurar un build limpio
      # mvn clean elimina todos los artefactos generados anteriormente
      - name: Limpiar carpeta target
        run: mvn clean

      # Paso 4: Ejecutar los tests del proyecto
      # mvn test compila el codigo y ejecuta todos los tests unitarios y de integracion
      # Los tests usan H2 en memoria gracias al perfil test
      - name: Ejecutar tests
        run: mvn test
